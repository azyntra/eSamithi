name: Clients

on:
  push:
    branches: [main]
    paths: ['src/**', 'mobile/**', 'package.json', 'package-lock.json', '.github/workflows/clients.yml']
  pull_request:
    paths: ['src/**', 'mobile/**', 'package.json', 'package-lock.json', '.github/workflows/clients.yml']

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (electron-vite)
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit
      # Guards the Reanimated 4 regression that made every tap wobble for 1.4s:
      # a partial spring config silently inherits mass:4/stiffness:900 and the
      # damping ratio collapses. See mobile/src/motion.ts.
      #
      # Invoked directly, NOT through an npm script: `packageJson:scripts` is a
      # source of the expo-updates runtime fingerprint, so adding a script to
      # mobile/package.json changes the runtime version and makes every OTA
      # update invisible to the installed app. Found the hard way.
      - name: Motion gate
        working-directory: mobile
        run: node scripts/check-motion.mjs
      # Sinhala is the default language, and a fontWeight on custom-family text
      # drops it to the system face at regular weight on Android.
      - name: Typography gate
        working-directory: mobile
        run: node scripts/check-type.mjs
