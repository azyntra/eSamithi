name: Web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml', 'src/renderer/src/i18n/**']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml', 'src/renderer/src/i18n/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Dictionaries in sync with the desktop source
        working-directory: web
        run: |
          npm run sync:i18n
          npm run check:i18n
          git diff --exit-code -- src/lib/i18n/generated || (echo "::error::run 'npm run sync:i18n' in web/ and commit the generated dictionaries" && exit 1)

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build (QA host, base /app/)
        working-directory: web
        run: npx vite build --mode testbed && npm run typecheck

      - name: First-load budget
        working-directory: web
        run: npm run check:bundle

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  deploy-testbed:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: testbed
    concurrency: testbed-web-deploy
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.TESTBED_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Publish to https://console.esamithi.com/app/
        # /opt/esamithi/app is bind-mounted into nginx: never replace the
        # directory itself (the mount follows the inode) — flip a symlink inside it.
        run: |
          tar -C dist -cf - . | ssh -o StrictHostKeyChecking=accept-new root@212.227.103.150 '
            set -e
            base=/opt/esamithi/app
            rel=$base/releases/${{ github.sha }}
            mkdir -p "$rel" && tar -C "$rel" -xf -
            ln -sfn "releases/${{ github.sha }}" "$base/current.tmp" && mv -Tf "$base/current.tmp" "$base/current"
            ls -dt "$base"/releases/* | tail -n +4 | xargs -r rm -rf
            readlink "$base/current"
          '

      - name: Smoke
        # The app sits behind a basic-auth preview gate until the pilot, so the
        # shell answers 401 here. Proving the release landed therefore means
        # checking an asset from THIS build, which the gate deliberately does
        # not cover, plus the gate itself and the API behind it.
        run: |
          set -euo pipefail
          asset=$(ls dist/assets/index-*.js | head -1 | xargs basename)
          echo "checking /app/assets/$asset"
          curl -sfI "https://console.esamithi.com/app/assets/$asset" | grep -qi "immutable"
          code=$(curl -s -o /dev/null -w '%{http_code}' https://console.esamithi.com/app/)
          test "$code" = "401" || test "$code" = "200" || { echo "shell answered $code"; exit 1; }
          curl -sf https://console.esamithi.com/api/v1/health > /dev/null
